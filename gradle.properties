# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# BẮT BUỘC nếu máy bạn cài JDK khác 21 làm mặc định (vd JDK 25).
# Fabric Loom 1.21.4 chỉ chạy ổn với JDK 21. Sau khi cài xong openjdk-21-jdk,
# bỏ dấu # dòng dưới và sửa đường dẫn cho đúng máy bạn (chạy lệnh:
#   update-alternatives --list java
# để xem đường dẫn JDK 21, ví dụ /usr/lib/jvm/java-21-openjdk-amd64)
#org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-amd64

# Fabric Properties
# CHÚ Ý: Sandbox tạo file này KHÔNG có internet để kiểm tra bản mới nhất.
# Trước khi build, hãy vào https://fabricmc.net/develop/ chọn Minecraft 1.21.4
# để lấy đúng yarn_mappings / loader_version / fabric_version mới nhất rồi sửa lại nếu cần.
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.19.3

# Mod Properties
mod_version=1.0.0
maven_group=jok.moon.custommenu
archives_base_name=custommenu

# Dependencies
fabric_version=0.119.3+1.21.4
